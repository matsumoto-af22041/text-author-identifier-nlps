# 実験全体の既定設定
seed: 42

paths:
    raw_corpus: data/raw/corpus20150426_with_titles.txt
    processed_corpus: data/processed/authors_corpus.json

# 生コーパスの構造仕様（references/AozoraCorpus.pdf 準拠：1 行目作品名，2 行目著者名，作品間に空行 1 行，句点改行）
corpus:
    # 配布仕様はシフト JIS だが，展開環境により UTF-8 へ変換済みの場合があるため順に厳密検証
    candidate_encodings: [cp932, utf-8]
    expected_num_works: 30
    min_work_chars: 1000

# 対象 4 作家・計 9 作品
targets:
    - id: soseki
      name: 夏目漱石
      works: [坊っちゃん, こころ, 三四郎]
    - id: dazai
      name: 太宰治
      works: [惜別, 斜陽]
    - id: terada
      name: 寺田寅彦
      works: [映画芸術, 柿の種]
    - id: tayama
      name: 田山花袋
      works: [蒲団, 田舎教師]

# チャンク長 L（目標累積文字数）
chunking:
    target_chunk_chars: [100, 500, 1000]

# 新旧仮名遣い検査（歴史的仮名遣いに特有の表記パターンの出現率）
orthography:
    per_chars: 10000
    # 全パターン合計の出現率（per_chars 文字あたり）がこの値を超える作品を旧仮名遣いと判定
    historical_rate_threshold: 5.0
    # 対象作品に旧仮名遣い判定が出た場合に処理を停止（Fail-Fast）
    fail_on_historical: true
    patterns:
        wi_we: "[ゐゑヰヱ]"
        te_wi: "てゐ"
        syou: "[でま]せう"
        darau: "だらう"
        you_old: "やう[なにだで]"
        sou_old: "さう[なにだで]"
        verb_fu: "[一-龥]ふ[。、」]"

# データ分割
split:
    # Intra-work Split で各作品から Test に回すチャンクの割合
    intra_test_ratio: 0.2
    # Intra-work Split の乱数シード（シードごとに 1 回分割し，平均と標準偏差を報告）
    intra_seeds: [42, 43, 44, 45, 46]
    # Train チャンク数の作家間均等化（間引き）．true のとき同じ run で間引きあり・なしの両方を実行
    #   Intra-work：分割と同じシード（intra_seeds）から独立な子乱数列を生成して間引く
    #   Inter-work：balance_seeds の各シードで，fold ごとに default_rng([seed, fold 番号]) で間引く（014 と同じ）
    balance_train: true
    balance_seeds: [42, 43, 44, 45, 46]

# 類似度計算（コサイン係数のみ：講義第 5 回 p.26，第 3 回 p.25）
similarity:
    names: [cosine]
    eps: 1.0e-12

# 推論器
classifier:
    methods: [centroid, knn]
    k_values: [1, 3, 5, 10, 20]
    # 先頭が本採用（per_author），以降は比較用（類似度行列を共有するため追加コストはほぼ無し）
    knn_modes: [per_author, global]

# 評価
evaluation:
    similarity_hist_bins: 50

# 特徴量レジストリ
#   class：モジュールパス.クラス名（BaseFeatureExtractor のサブクラス）
#   params：コンストラクタ引数（本採用仕様）．キー名は各モジュールの __init__ 引数と一致させること
#   ablations：--ablation 指定時に 1 引数ずつ差し替えて追加実行する値（本採用値は含めない）
#   combinations：--ablation 指定時に複数引数を同時に差し替えて追加実行する条件の組（任意，各要素は params の部分辞書）
features:
    base:
        description: 文字 unigram 相対頻度（ベースライン）
        class: src.features.char_unigram.CharUnigramExtractor
        params: {}
        ablations: {}
    A:
        description: 文字 Bi-gram・記号（読点・文末記号・開き括弧類）の相対頻度（plans/002）
        class: src.features.stylometry_char.StylometryCharExtractor
        params: {scaling: none, blocks: all, max_features: 1000}
        ablations: {scaling: [minmax], blocks: [bigram, symbol]}
    B:
        description: 品詞 2-gram・付属語（助詞・助動詞）の相対頻度（plans/003）
        class: src.features.pos_function.POSFunctionExtractor
        params: {token_key: surface, target_pos: [助詞, 助動詞], max_features: 1500, blocks: all}
        ablations: {token_key: [lemma], target_pos: [[助詞, 助動詞, 接続詞, 連体詞, 感動詞], [名詞, 動詞, 形容詞]], blocks: [pos_bigram, words]}
        # 内容語対照 × 語ブロックのみ（Core Message の主結果表の統制比較，plans/025）
        combinations: [{target_pos: [名詞, 動詞, 形容詞], blocks: words}]
    C:
        description: 内容語（名詞・動詞・形容詞）の TF-IDF（plans/004）
        class: src.features.word_tfidf.WordTFIDFExtractor
        params: {max_features: 2000}
        ablations: {}
    D:
        description: C の TF-IDF 行列の SVD による LSI 潜在意味ベクトル（plans/005）
        class: src.features.lsi_embedding.LSIEmbeddingExtractor
        params: {n_components: 32, projection: u}
        ablations: {n_components: [8, 16, 64], projection: [us]}

# 実験条件（scripts/run_experiments.py）
experiment:
    # 既定で実行する特徴量（--features で上書き可能）
    features: [A, B, C, D]
    splits: [intra, inter]
    # アブレーションを実行するチャンク長
    ablation_chunk_chars: [500]
    output_dir: outputs

# レポート（scripts/plot_results.py）
report:
    # 図表の代表条件（類似度分布・ヒートマップ・チャンク長推移・特徴量比較表）
    headline:
        chunk_chars: 500
        similarity: cosine
        classifier: centroid
    # 最良モデル選択の基準（Inter-work の Pooled 指標のシード平均，本採用の特徴量設定のみ対象）
    best_model_metric: balanced_accuracy
    num_misclassified_examples: 20
    excerpt_chars: 120
