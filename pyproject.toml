[project]
name = "text-author-identifier-nlps"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fugashi-plus[unidic-lite]",
    "matplotlib",
    "numpy",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
