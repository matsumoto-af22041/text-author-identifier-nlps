    title: 【担当 D】定義
    claim: 一緒に使われやすい単語グループ（共起構造）を $K$ 次元に圧縮して類似度を測る
    layout: split
    ratio: 0.55
    left:
      - deflist:
          rows:
            - ["特異値分解", '$X = U \Sigma V^\top$（$X$：Train の TF-IDF 行列）[^1]']
            - ["次元削減", '上位 $K$ 成分 $U_K, \Sigma_K, V_K$ だけを残す[^1]']
            - ["射影", '$Z = X V_K \Sigma_K^{-1}$（Train チャンク）[^2]']
            - ["照会の射影", '$\hat{\vec{q}} = \Sigma_K^{-1} V_K^\top \vec{q}$（Test チャンク）[^2]']
            - ["導出", '$X = U \Sigma V^\top$ から $U_K$ を求める式を導き，照会にも同じ変換を適用[^2]']
            - ["累積寄与率", "上位 $K$ 個の特異値の二乗和 ÷ 全体"]
          widths: [0.26, 0.74]
          size: 14
      - bullets:
          - "比べるベクトル：TF-IDF ベクトルを $K = 32$ 次元の LSI 空間に射影したベクトルと各作家の重心（同じ空間）"
          - text: "射影したベクトルは負の成分を含み，類似度は $[-1, 1]$ の値をとる"
            sub:
              - "負の類似度：潜在的な話題の重みが逆向き"
              - "重心法は類似度の順位のみを使うため判定に影響しない"
        size: 14
    right:
      - diagram: svd
        h: 2.3
      - text: "$N$：Train チャンク数，$M$：語彙の次元数，$K$：残す次元数（長方形の比は模式）"
        muted: true
      - text: '$U_K = X V_K \Sigma_K^{-1}$[^2]'
        size: 18
    footnotes:
      - 第 5 回 p.36-37
      - 第 5 回 p.37 からの導出（独自設計）
    notes:
      time: 45 秒
      points:
        - 表面上は違う単語を使っていても，一緒に使われやすい単語グループ（共起構造）を K 次元に圧縮して類似度を測る．
        - 第 5 回 p.37 の「検索質問を V によりトピックの重みベクトルに変換し，U を用いて文書と比較する」の式としての実現．X = U Σ V の転置 の両辺に右から V_K と Σ_K の逆行列を掛けると U_K = X V_K Σ_K の逆行列（右下の式）．照会ベクトルにも同じ変換を適用．
        - 模式図は X（N × M）を U_K（N × K），Σ_K（K × K），V_K の転置（K × M）の積で近似することを示す．
        - LSI は第 3 回の分散表現（ニューラル手法）とは別物であり，「分散表現」とは呼ばない．
        - 射影したベクトルは負の成分を含むため，コサイン類似度が負になりうる（潜在的な話題の重みが逆向き）．重心法は類似度が最大の作家を選ぶだけで，値の符号や範囲は判定に影響しない．
      runs: [slides_d.md]
    num_sources: ["storyline:Slide 18", "slides_d"]

