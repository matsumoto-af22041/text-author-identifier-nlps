    notes:
      time: 質疑で表示
      points:
        - 最良条件は Test の結果から選んでいるため楽観的な上限であり，汎化性能の推定ではない（作家別正解率の平均 0.676 ± 0.009，作家別 MAP の平均 0.492 ± 0.002）．
