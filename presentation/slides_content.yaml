          - "条件は Test の結果から選んだ最良条件（楽観的な上限）"
          - "漱石の作家別正解率 0.367（2035 件中 1145 件が花袋）"
          - "代表条件（B，$L = 500$，重心法）でも漱石の 45.0% が花袋"
