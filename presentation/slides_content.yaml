# 発表スライドの内容（scripts/build_slides.py が presentation/slides.pptx を生成，scripts/check_slides.py が検査）．
#
# 内容は presentation/presentation_storyline.md の各スライドの「載せるデータ・主張・出典」の要約．新しい数値・主張は加えない．
# 修正はこのファイル（と生成スクリプト）で行い，pptx を直接編集しない．
#
# 書式（文字列中のマークアップ）：
#   $...$  数式（LaTeX の記法．例：$\mu_{\text{same}}$，$\lVert \vec{x} \rVert^2$）．scripts/build_slides.py が 1 式ずつ lualatex で
#          コンパイルした画像（代替テキストに元の LaTeX）として置く．短い記号（例：$L = 500$，$K$，$\hat{c}_a$）も画像にし，
#          書体を Computer Modern にそろえる（041）．本文・表のセル・定義の一覧・主張の帯・強調枠のどこにでも書ける．
#          段落の途中の複雑な式（分数・上付き・添字付きの等式等）は避け，独立の行（数式だけの段落）に出す．PowerPoint 上で式を編集しない．
#          バックスラッシュを含む文字列は YAML の単一引用符で書く．発表者ノート（notes）は平文のまま（数式の記法を使わない）．
#   [^n]   出典の番号（右肩の [n]，スライド下部の footnotes の n 番目と対応）
#   **x**  太字
# ブロック：
#   bullets: [文字列 | {text: 文字列, sub: [文字列, ...]}]     size（pt）は任意
#   table: {header: [...], rows: [[...]], widths: [比率, ...], size: pt}   セル内の改行は "\n"
#   figure: パス（presentation/ からの相対），h: 高さの上限（インチ）
#   figures: {paths: [...], cols: 列数, h: 高さの上限}
#   diagram: concept（Slide 2 の概念図）| split（Slide 7 の分割の図）| a_blocks（Slide 9 の A のブロックの構成）
#            | svd（Slide 18 の特異値分解の模式図）．h で高さ（インチ）を変えられる
# スライドの layout：cover（表紙：title，subtitle，members: [[役割, 氏名欄], ...]）| single（body）| split（left，right，ratio）
#   box: 強調枠の文字列        text: 補足の文字列（muted: true で薄い文字）
#   deflist: {rows: [[用語, 説明] | [文字列] | [用語, [説明の箇条書き, ...]]], widths: [左, 右], size: pt}
#            定義の一覧（罫線なしの 2 列の表．左列：用語・記号，右列：説明．1 要素の行は 2 列にまたがる）
# 照合の指定（check_slides.py．指標・条件まで出典の CSV・storyline の表のセルと照合）：
#   table の refs: {vars: [行ごとの置換（null は照合しない）], cols: [列ごとの雛形（{v} や {s} 等を置換）], cells: {"行,列": 指定}}
#   スライドの num_refs: [{at: 本文の文字列の一部, refs: [数値ごとの指定（null は照合しない）]}]
#   指定の書き方は check_slides.py の RefSources（summary:<key>:<列>，per_work:<L>:<作品>:<列>，sens:<L>:<条件>:<列>，
#   stats:<key>:<行>,<列>，<指定> - <指定>，story:<見出し>#<n>|<行>|<列>）
# num_sources：本文・表・ノートの数値を照合する資料の範囲（check_slides.py）．
#   storyline:<スライド番号>  storyline の表の該当行（例：storyline:Slide 9，storyline:S2）
#   storyline#<見出し>        storyline の見出し（####／##）から次の見出しまで
#   qa#<見出し>               qa_defense_matrix.md の見出し（###）から次の見出しまで
#   slides_d                  slides_d.md の全体

theme:
  # presentation/orig.pptx のテーマから読み取った配色・フォント・縦横比（文字・図・メモは使わない）
  slide_width_in: 13.333
  slide_height_in: 7.5
  font_latin: Yu Gothic
  font_ea: 游ゴシック
  math:
    # 数式の画像化（scripts/build_slides.py）．コマンドは PATH から探す（無ければ --lualatex / --pdftocairo で指定）
    lualatex: lualatex
    pdftocairo: pdftocairo
    dpi: 600
    cache_dir: outputs/slides_math
  figures:
    # scripts/plot_slide_figures.py のスライド用の再描画の大きさ（インチ，スライドに置く大きさ [幅, 高さ]）と文字の大きさ（pt）
    font_pt: 9
    core: [5.85, 4.8]
    composition: [5.3, 1.85]
    chunk_length: [6.6, 4.3]
    s8_heatmaps: [5.0, 4.15]
    s8_distributions: [4.0, 4.15]
  colors:
    text: "222222"       # dk1
    muted: "8C8C8C"      # dk2
    light: "EEF0F0"      # lt2
    accent: "F7D046"     # accent1
    accent_dark: "C99A00" # accent4
    line: "BDBDBD"       # accent2
    highlight: "FFF4CC"  # スライド本文の強調の塗り
    strong: "4A4A4A"     # accent5
    background: "FFFFFF" # lt1

deck:
  title: 青空文庫の文体・表現類似度に基づく著者識別システム

slides:
  # ------------------------------------------------------------------ 表紙・導入と共通の枠組み
  - id: "1"
    kind: main
    section: 表紙
    layout: cover
    title: 青空文庫の文体・表現類似度に基づく著者識別システム
    members:
      - [リーダー, （氏名）]
      - [担当 A, （氏名）]
      - [担当 B, （氏名）]
      - [担当 C, （氏名）]
      - [担当 D, （氏名）]
    footnotes: []
    notes:
      time: 15 秒
      points:
        - 研究タイトルと班の紹介．
        - 氏名・学籍番号は提出直前に研究者が提出用の版に記入（この版には書かない）．
      runs: []
    num_sources: ["storyline:Slide 1"]

  - id: "2"
    kind: main
    section: 導入
    title: 研究の問い・仮説と班の担当
    claim: 4 つの観点で類似度を測り，未知作品の著者を識別できる観点とその理由を調べる
    layout: split
    left:
      - box: "問い：4 つの観点で文章の類似度を測り，未知作品の著者を識別できるのはどれか．できないならなぜか"
      - text: "仮説：内容によらない特徴は，作品が変わっても本人らしさが残る"
      - table:
          header: [担当, 担当したこと]
          rows:
            - [リーダー, "データの抽出\n評価器\n統合実験"]
            - [担当 A, 表層（文字づかいそのもの）と句読点]
            - [担当 B, 品詞の並びと付属語]
            - [担当 C, 内容語（TF-IDF）]
            - [担当 D, 内容語の共起による潜在意味（LSI）]
          widths: [0.24, 0.76]
          size: 13
    right:
      - diagram: concept
      - text: "成功の条件：同じ著者の文章同士なら類似度が高く，違う著者同士なら低くなる類似度の測り方を見つけること"
    footnotes: ["構想発表資料 p.4"]
    notes:
      time: 40 秒
      points:
        - 4 つの観点で類似度を測り，未知作品の著者を識別できる観点とその理由を調べる．
        - 仮説は，内容（トピック・固有名詞）によらない特徴（文字づかい・句読点・品詞の並び・付属語）は，作品が変わっても本人らしさが残る，というもの．内容語の特徴は作品が変わると大きく落ちると予想．
        - 成功の条件は「同じ著者の文章同士なら類似度が高く，違う著者同士なら低くなる『類似度の測り方』を見つけること」．
        - 担当 A～D は各特徴量（観点）の設計・実装・実験，リーダーはデータの抽出・評価器・統合実験．
      runs: []
    num_sources: ["storyline:Slide 2"]

  - id: "3"
    kind: main
    section: 導入
    title: システムの機能と処理の流れ
    claim: 著者不明の文章を受け取り，各作家との類似度から最も近い作家を推定して返す
    layout: single
    body:
      - diagram: flow
        h: 2.2
      - deflist:
          rows:
            - ["入力", "著者不明の文章（チャンク）"]
            - ["出力", "推定した著者と，作家ごとの類似度の順位"]
            - ["学習", "Train チャンクのみから語彙・IDF・SVD・作家の重心を算出して保存（重みの更新はしない）[^1]"]
            - ["推定", "Test チャンクは学習済みの変換を通し，重心法で著者を推定[^2]"]
            - ["評価", "推定した著者と正解の著者を比べ，指標（後述）を求める[^1]"]
          widths: [0.14, 0.86]
          size: 14
    footnotes:
      - 独自設計
      - 第 2 回 p.48
    notes:
      time: 50 秒
      points:
        - 著者不明の文章を受け取り，各作家との類似度から最も近い作家を推定して返すシステム．
        - 処理の流れは，前処理（作品の抽出・チャンク分割）→ 形態素解析 → 特徴抽出 A～D → コサイン類似度 → 重心法による著者の推定 → 評価．
        - 「学習」は重みの更新ではなく，Train チャンクのみから語彙・IDF・SVD の射影・作家ごとの重心を求めて保存すること．Test チャンクはその変換を通すだけで，Test の情報は使わない．
      runs: []
    num_sources: ["storyline:Slide 3"]

  - id: "4"
    kind: main
    section: 導入
    title: 記号・用語の定義（発表全体で使うもの）
    claim: 類似度はすべて，チャンクの特徴量ベクトルのコサイン類似度で測る
    layout: split
    ratio: 0.5
    left:
      - deflist:
          rows:
            - ["チャンク", '文の区切りを保ったまま約 500 字ずつまとめたもの（$L = 500$，後述）']
            - ["作品内分割（Intra-work）", "各作品のチャンクを Train / Test に分ける（5 シード，後述）[^1]"]
            - ["作品間分割（Inter-work）", "1 作品を丸ごと Test に回す（9 fold）[^1]"]
            - ["間引き", "Train チャンク数を作家ごとに最少の作家の数にそろえる（後述）[^1]"]
          widths: [0.36, 0.64]
          size: 14
    right:
      - deflist:
          rows:
            - ['$\vec{d}_i$', "Train チャンク $i$ の特徴量ベクトル"]
            - ['$\vec{q}$', "照会する Test チャンクの特徴量ベクトル"]
            - ["コサイン類似度", ['$\cos(\vec{d}_i, \vec{q}) = \frac{\vec{d}_i \cdot \vec{q}}{\lVert \vec{d}_i \rVert \lVert \vec{q} \rVert}$[^2]', "A～D 共通の類似度"]]
            - ['$D_a$', "作家 $a$ の Train チャンクの集合"]
            - ["重心法", ["重心：作家の Train チャンクの特徴量ベクトルの平均（作家を代表するベクトル）", '$\vec{c}_a = \frac{1}{|D_a|} \sum_{\vec{d}_i \in D_a} \vec{d}_i$[^3]', '$\hat{a} = \mathop{\arg\max}_{a} \cos(\vec{c}_a, \vec{q})$', "作家の重心との類似度が最大の作家と判定"]]
          widths: [0.3, 0.7]
          size: 14
    footnotes:
      - 独自設計
      - 第 5 回 p.26，第 3 回 p.25
      - 第 2 回 p.48
    notes:
      time: 40 秒
      points:
        - 類似度はすべて，チャンクの特徴量ベクトルのコサイン類似度で測る（A～D 共通）．
        - 重心法は，作家 a の Train チャンクの特徴量ベクトルの平均（重心）を作家の代表文書とし，照会ベクトルとのコサイン類似度が最大の作家を推定結果とする（第 2 回 p.48 の代表文書による分類）．
        - チャンクの作り方・5 シード・間引きは Slide 7 で説明．作品間分割は LOWO 9 fold の Pooled 集計．
      runs: []
    num_sources: ["storyline:Slide 4"]

  - id: "5"
    kind: main
    section: 導入
    title: 指標の定義と基準値
    claim: 以降のすべての値は，特徴量を使わない予測の基準値と比べて読む
    layout: split
    ratio: 0.55
    left:
      - deflist:
          rows:
            - ["作家別 MAP の平均", ['$\text{AP} = \frac{1}{R} \sum_{k :\, \text{rel}(k)} P@k$[^1]', '$R$：照会と同じ著者の Train チャンク数，$P@k$：上位 $k$ 件の適合率', "照会ごとの AP を作家ごとに平均し，4 作家で単純平均[^2]"]]
            - ["作家別正解率の平均", ['$\frac{1}{4} \sum_{a} \frac{n_{a \to a}}{n_a}$[^3]', '$n_a$：作家 $a$ の Test チャンク数，$n_{a \to a}$：そのうち $a$ と判定された数']]
          widths: [0.25, 0.75]
          size: 15
    right:
      - table:
          header: [指標, 基準値]
          rows:
            - ["作家別 MAP の平均[^1]", "0.260"]
            - ["作家別正解率の平均[^3]", "0.25"]
          widths: [0.68, 0.32]
          size: 12
          refs:
            cells:
              "0,1": "summary:A|L500|inter|bal|cosine|centroid|mean:map_macro_random"
              "1,1": "summary:A|L500|inter|bal|cosine|centroid|mean:balanced_accuracy_random"
      - text: "基準値は特徴量を使わない予測の値（$L = 500$ の作品間分割・間引きあり）[^2]"
        muted: true
      - figure: figures/test_composition.png
        h: 1.85
      - text: "作家別の値の単純平均は Test の作家構成に左右されない"
        size: 13
    footnotes:
      - 第 5 回 p.31 を参考にした独自設計
      - 独自設計
      - 第 5 回 p.28，第 6 回 p.44
    notes:
      time: 40 秒
      points:
        - 以降のすべての値は，特徴量を使わない予測の基準値と比べて読む．
        - 作家別の値の単純平均は，Test の作家構成（漱石が約半数）に左右されないため．正解率（全 Test チャンクでの集計）は載せない．
        - 図の計算：L = 500 の作品間分割（LOWO 9 fold）の各 fold の Test チャンク数を作家ごとに合計（漱石 801，太宰 330，寺田 177，花袋 371，計 1679）．全件を漱石と予測すると，全 Test チャンクでの正解の割合は 801 / 1679 = 0.477，作家別正解率は漱石 1，他の 3 作家 0 で平均 0.25．
        - 作品間分割は LOWO 9 fold の Pooled 集計．基準値は L = 500 の Inter-work，間引きありの値．導出は補助 S5．
        - 本編の指標はこの 2 つ．2 つに絞った理由は補助 S4，作家別 F 値の平均と MRR の定義と基準値は補助 S5．
      runs: [full_006（図は plot_slide_figures.py で full_006 の folds.csv から描画）]
    num_sources: ["storyline:Slide 5", "storyline#評価データ（指標・図表）」の定義", "storyline#表 1（Slide 6）", "qa#なぜ普通の正解率を使わないのか"]

  - id: "6"
    kind: main
    section: 導入
    title: 対象データの選定（青空文庫 4 作家・9 作品）
    claim: 同じ著者の別作品でも類似度が高くなるかを見るため，複数作品がある 4 作家を選定
    layout: split
    ratio: 0.38
    left:
      - table:
          header: [作品数, 作家数]
          rows:
            - ["3", "1"]
            - ["2", "3"]
            - ["1", "21"]
            - ["計 30 作品", "25"]
          widths: [0.55, 0.45]
          size: 14
          refs:
            vars: ["3", "2", "1", "計 30 作品"]
            cols: ["story:表 1（Slide 6）#1|{v}|作品数", "story:表 1（Slide 6）#1|{v}|作家数"]
      - bullets:
          - "2 作品以上の作家は 25 名中 4 名のみ[^1]"
          - "明治～昭和初期の口語体の作家にそろえる"
          - "時代の違いではなく著者の違いを測る"
        size: 16
    right:
      - table:
          header: [作家, 作品, 文字数, 文数, 'チャンク数（$L = 500$）']
          rows:
            - [夏目漱石, 坊っちゃん, "88,277", "2,708", "168"]
            - [夏目漱石, こころ, "159,983", "5,055", "307"]
            - [夏目漱石, 三四郎, "168,641", "6,776", "326"]
            - [太宰治, 惜別, "91,784", "1,959", "167"]
            - [太宰治, 斜陽, "88,795", "2,491", "163"]
            - [寺田寅彦, 映画芸術, "26,749", "459", "49"]
            - [寺田寅彦, 柿の種, "68,115", "1,488", "128"]
            - [田山花袋, 蒲団, "44,497", "1,307", "85"]
            - [田山花袋, 田舎教師, "149,868", "4,495", "286"]
            - [合計, 9 作品, "886,709", "26,738", "1,679"]
          widths: [0.18, 0.2, 0.2, 0.17, 0.25]
          size: 12
          refs:
            vars: [作品=坊っちゃん, 作品=こころ, 作品=三四郎, 作品=惜別, 作品=斜陽, 作品=映画芸術, 作品=柿の種, 作品=蒲団, 作品=田舎教師, 作家=合計]
            cols: [null, null, "story:表 1（Slide 6）#2|{v}|文字数", "story:表 1（Slide 6）#2|{v}|文数", "story:表 1（Slide 6）#2|{v}|チャンク数 $L = 500$"]
    footnotes: [独自設計]
    notes:
      time: 35 秒
      points:
        - 同じ著者の「別の作品」でも類似度が高くなるかを見るため，複数作品がある 4 作家（計 9 作品）を選定．
        - 文語体や翻訳文学を除き，明治～昭和初期の口語体作家に揃えることで「時代の違い」ではなく「著者の違い」を測るデータにした．
        - 漱石の 3 作品で L = 500 のチャンクの 48%（801 / 1,679）を占め，『映画芸術』は 49 チャンクと最少（Slide 7 の間引きの背景）．
      runs: [verify_qa_points（Q1），full_006（作品別のチャンク数と照合済み）]
    num_sources: ["storyline:Slide 6", "storyline#表 1（Slide 6）"]

  - id: "7"
    kind: main
    section: 導入
    title: 実験設定：作品内分割と作品間分割
    claim: 未知の別作品（作品間分割）でも同じ著者なら類似度が高くなるかを主な検証課題とする
    layout: split
    ratio: 0.5
    left:
      - diagram: split
    right:
      - bullets:
          - text: "同じ作品のチャンクは題材・登場人物・底本の表記を共有[^1]"
            sub:
              - "Train と Test に分かれると作品の一致で識別できる（トピック漏洩）"
          - text: "チャンク分割：文単位で目標文字数 $L$ まで束ねる[^2]"
            sub:
              - "$L = 500$：実測 527.3 ± 36.7 字"
          - text: "間引き：作家ごとに最少の作家のチャンク数にそろえる（5 シード）[^3]"
            sub:
              - "間引かないと Train の約半数が漱石"
        size: 15
      - diagram: balance
    footnotes:
      - 第 6 回 p.42，独自設計
      - 第 2 回 p.8，独自設計
      - 独自設計
    notes:
      time: 50 秒
      points:
        - 未知の別作品（作品間分割）でも同じ著者なら類似度が高くなるかをメインの検証課題に設定．
        - 同じ小説の別ページ（作品内分割）で類似度が高くなるのは当然（登場人物が同じ）．同じ作品のチャンクが Train と Test に分かれると作品の一致で識別できてしまい精度が過大に出る（トピック漏洩）．これを避ける設計．
        - 文末の表現を壊さないよう，文単位で目標文字数 L まで束ねるチャンク分割（文の定義は第 2 回 p.8）．
        - 漱石の作品は長く，間引かないと Train の約半数が漱石になるため間引く．間引きなしを併記．
        - 下の図：作品内分割・作品間分割の各分割（fold）で，Train チャンクを作家ごとに一様に抜き出し，最少の作家の数 n_min にそろえる．Test は間引かない．棒の長さは模式．
        - 作品内分割は 5 シード，作品間分割は LOWO 9 fold（Pooled）．
      runs: [verify_qa_points（実測チャンク長），間引きの根拠は 013～015]
    num_sources: ["storyline:Slide 7"]

