        - 結果は全特徴量で L = 100 → 500 で作家別 MAP の平均が上がり，A・B は 500 → 1000 でもさらに上がる（B：0.314 → 0.420 → 0.492）．
        - C・D の作家別正解率の平均は 500 → 1000 でほぼ横ばい（C 0.342 → 0.332，D 0.296 → 0.281）．L = 100 の実測は 125.8 ± 33.1 字．
      runs: [full_006]
    num_sources: ["storyline:S7", "storyline#チャンク長別の推移"]

