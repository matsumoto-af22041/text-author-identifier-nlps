# 発表スライドの内容（scripts/build_slides.py が presentation/slides.pptx を生成，scripts/check_slides.py が検査）．
#
# 内容は presentation/presentation_storyline.md の各スライドの「載せるデータ・主張・出典」の要約．新しい数値・主張は加えない．
# 修正はこのファイル（と生成スクリプト）で行い，pptx を直接編集しない．
#
# 書式（文字列中のマークアップ）：
#   _{x}   下付き（例：μ_{same}）       ^{x}   上付き（例：‖x‖^{2}）
#   [^n]   出典の番号（右肩の [n]，スライド下部の footnotes の n 番目と対応）
#   **x**  太字
# ブロック：
#   bullets: [文字列 | {text: 文字列, sub: [文字列, ...]}]     size（pt）は任意
#   table: {header: [...], rows: [[...]], widths: [比率, ...], size: pt}   セル内の改行は "\n"
#   figure: パス（presentation/ からの相対），h: 高さの上限（インチ）
#   figures: {paths: [...], cols: 列数, h: 高さの上限}
#   diagram: concept（Slide 1 の概念図）| split（Slide 4 の分割の図）
#   box: 強調枠の文字列        text: 補足の文字列（muted: true で薄い文字）
# num_sources：本文・表・ノートの数値を照合する資料の範囲（check_slides.py）．
#   storyline:<スライド番号>  storyline の表の該当行（例：storyline:Slide 8，storyline:S1）
#   storyline#<見出し>        storyline の見出し（####／##）から次の見出しまで
#   qa#<見出し>               qa_defense_matrix.md の見出し（###）から次の見出しまで
#   slides_d                  slides_d.md の全体

theme:
  # presentation/orig.pptx のテーマから読み取った配色・フォント・縦横比（文字・図・メモは使わない）
  slide_width_in: 13.333
  slide_height_in: 7.5
  font_latin: Yu Gothic
  font_ea: 游ゴシック
  colors:
    text: "222222"       # dk1
    muted: "8C8C8C"      # dk2
    light: "EEF0F0"      # lt2
    accent: "F7D046"     # accent1
    accent_dark: "C99A00" # accent4
    line: "BDBDBD"       # accent2
    highlight: "FFF4CC"  # スライド本文の強調の塗り
    strong: "4A4A4A"     # accent5
    background: "FFFFFF" # lt1

deck:
  title: 青空文庫の文体・表現類似度に基づく著者識別システム

slides:
  # ------------------------------------------------------------------ 導入と共通の枠組み
  - id: "1"
    kind: main
    section: 導入
    layout: title
    title: 青空文庫の文体・表現類似度に基づく著者識別システム
    claim: 4 つの観点で類似度を測り，未知作品の著者を識別できる観点とその理由を調べる
    left:
      - box: "問い：4 つの観点で文章の類似度を測り，未知作品の著者を識別できるのはどれか．できないならなぜか"
      - table:
          header: [担当, 範囲]
          rows:
            - [リーダー, 導入・統合比較・結論]
            - [担当 A, 表層・文字づかいと句読点]
            - [担当 B, 品詞の並びと付属語]
            - [担当 C, 使われている内容語（TF-IDF）]
            - [担当 D, 内容語の共起による潜在意味（LSI）]
          widths: [0.3, 0.7]
          size: 14
    right:
      - diagram: concept
      - text: "成功の条件：同じ著者の文章同士なら類似度が高く，違う著者同士なら低くなる類似度の測り方を見つけること"
    footnotes: ["構想発表資料 p.4"]
    notes:
      time: 30 秒
      points:
        - 4 つの観点で類似度を測り，未知作品の著者を識別できる観点とその理由を調べる．
        - 成功の条件は「同じ著者の文章同士なら類似度が高く，違う著者同士なら低くなる『類似度の測り方』を見つけること」．
        - 氏名・学籍番号は提出直前に研究者が提出用の版に記入（この版には書かない）．
      runs: []
    num_sources: ["storyline:Slide 1"]

  - id: "2"
    kind: main
    section: 導入
    title: 記号・用語の定義（発表全体で使うもの）
    claim: 以降のすべての値は，特徴量を使わない予測の基準値と比べて読む
    layout: split
    ratio: 0.6
    left:
      - bullets:
          - "L：チャンク分割の目標文字数（L ∈ {100, 500, 1000}）"
          - "作品内分割（Intra-work）：各作品のチャンクを Train / Test に分ける（5 シード）[^1]"
          - "作品間分割（Inter-work）：1 作品を丸ごと Test に回す（9 fold）[^1]"
          - "間引き：Train チャンク数を作家ごとに最少の作家の数にそろえる[^1]"
          - "コサイン類似度：cos(d_{i}, q) = (d_{i} · q) / (‖d_{i}‖ ‖q‖)[^2]"
          - "重心法：作家の Train チャンクの平均ベクトルとの類似度が最大の作家と判定[^3]"
          - "類似度ギャップ：ΔS = μ_{same} − μ_{diff}（同じ特徴量内の比較のみ）[^1]"
        size: 16
    right:
      - table:
          header: [指標, 基準値]
          rows:
            - ["作家別 MAP の平均[^4]", "0.260"]
            - ["作家別正解率の平均[^5]", "0.25"]
            - ["作家別 F 値の平均[^6]", "0.233"]
            - ["MRR[^4]", "0.521"]
          widths: [0.68, 0.32]
          size: 14
      - text: "基準値：特徴量を使わない予測（L = 500 の作品間分割，間引きあり）[^1]"
        muted: true
      - text: "作家別の値は 4 作家で単純平均（Test の作家構成に左右されない）[^1]"
    footnotes:
      - 独自設計
      - 第 5 回 p.26，第 3 回 p.25
      - 第 2 回 p.48
      - 第 5 回 p.31 を参考にした独自設計
      - 第 5 回 p.28，第 6 回 p.44
      - 第 5 回 p.28-29
    notes:
      time: 60 秒
      points:
        - 以降のすべての値は，特徴量を使わない予測の基準値と比べて読む．
        - 作家別の値の単純平均は，Test の作家構成（漱石が約半数）に左右されないため．正解率（全 Test チャンクでの集計）は載せない．
        - 作品間分割は LOWO 9 fold の Pooled 集計．基準値は L = 500 の Inter-work，間引きありの値．
      runs: [full_006]
    num_sources: ["storyline:Slide 2", "storyline#評価データ（指標・図表）」の定義"]

  - id: "3"
    kind: main
    section: 導入
    title: 対象データの選定（青空文庫 4 作家・9 作品）
    claim: 同じ著者の別作品でも類似度が高くなるかを見るため，複数作品がある 4 作家を選定
    layout: split
    ratio: 0.38
    left:
      - table:
          header: [作品数, 作家数]
          rows:
            - ["3", "1"]
            - ["2", "3"]
            - ["1", "21"]
            - ["計 30 作品", "25"]
          widths: [0.55, 0.45]
          size: 14
      - bullets:
          - "2 作品以上の作家は 25 名中 4 名のみ[^1]"
          - "明治～昭和初期の口語体の作家にそろえる"
          - "時代の違いではなく著者の違いを測る"
        size: 16
    right:
      - table:
          header: [作家, 作品, 文字数, 文数, "チャンク数（L = 500）"]
          rows:
            - [夏目漱石, 坊っちゃん, "88,277", "2,708", "168"]
            - [夏目漱石, こころ, "159,983", "5,055", "307"]
            - [夏目漱石, 三四郎, "168,641", "6,776", "326"]
            - [太宰治, 惜別, "91,784", "1,959", "167"]
            - [太宰治, 斜陽, "88,795", "2,491", "163"]
            - [寺田寅彦, 映画芸術, "26,749", "459", "49"]
            - [寺田寅彦, 柿の種, "68,115", "1,488", "128"]
            - [田山花袋, 蒲団, "44,497", "1,307", "85"]
            - [田山花袋, 田舎教師, "149,868", "4,495", "286"]
            - [合計, 9 作品, "886,709", "26,738", "1,679"]
          widths: [0.18, 0.2, 0.2, 0.17, 0.25]
          size: 12
    footnotes: [独自設計]
    notes:
      time: 45 秒
      points:
        - 同じ著者の「別の作品」でも類似度が高くなるかを見るため，複数作品がある 4 作家（計 9 作品）を選定．
        - 文語体や翻訳文学を除き，明治～昭和初期の口語体作家に揃えることで「時代の違い」ではなく「著者の違い」を測るデータにした．
        - 漱石の 3 作品で L = 500 のチャンクの 48%（801 / 1,679）を占め，『映画芸術』は 49 チャンクと最少（Slide 4 の間引きの背景）．
      runs: [verify_qa_points（Q1），full_006（作品別のチャンク数と照合済み）]
    num_sources: ["storyline:Slide 3", "storyline#表 1（Slide 3）"]

  - id: "4"
    kind: main
    section: 導入
    title: 実験設定：作品内分割と作品間分割
    claim: 未知の別作品（作品間分割）でも同じ著者なら類似度が高くなるかを主な検証課題とする
    layout: split
    ratio: 0.5
    left:
      - diagram: split
    right:
      - bullets:
          - text: "同じ作品のチャンクは題材・登場人物・底本の表記を共有[^1]"
            sub:
              - "Train と Test に分かれると作品の一致で識別できる（トピック漏洩）"
          - text: "チャンク分割：文単位で目標文字数 L まで束ねる[^2]"
            sub:
              - "実測 125.8 ± 33.1 字（L = 100）"
              - "実測 527.3 ± 36.7 字（L = 500）"
              - "実測 1029.1 ± 42.9 字（L = 1000）"
          - text: "間引き：作家ごとに最少の作家のチャンク数にそろえる（5 シード）[^3]"
            sub:
              - "間引かないと Train の約半数が漱石"
        size: 16
    footnotes:
      - 第 6 回 p.42，独自設計
      - 第 2 回 p.8，独自設計
      - 独自設計
    notes:
      time: 60 秒
      points:
        - 未知の別作品（作品間分割）でも同じ著者なら類似度が高くなるかをメインの検証課題に設定．
        - 同じ小説の別ページ（作品内分割）で類似度が高くなるのは当然（登場人物が同じ）．同じ作品のチャンクが Train と Test に分かれると作品の一致で識別できてしまい精度が過大に出る（トピック漏洩）．これを避ける設計．
        - 文末の表現を壊さないよう，文単位で目標文字数 L まで束ねるチャンク分割（文の定義は第 2 回 p.8）．
        - 漱石の作品は長く，間引かないと Train の約半数が漱石になるため間引く．間引きなしを併記．
        - 作品内分割は 5 シード，作品間分割は LOWO 9 fold（Pooled）．
      runs: [verify_qa_points（実測チャンク長），間引きの根拠は 013～015]
    num_sources: ["storyline:Slide 4"]

  - id: "5"
    kind: main
    section: 導入
    title: 4 つの類似度観点と判別の方法
    claim: 4 観点とも同じコサイン類似度と重心法で比べ，違いを特徴量だけに絞る
    layout: single
    body:
      - table:
          header: [観点, 特徴量, 何で類似度を測るか]
          rows:
            - [A, 文字 Bi-gram・記号, 表層・文字づかいと句読点]
            - [B, 品詞 2-gram・付属語, 品詞の並びと付属語]
            - [C, 内容語 TF-IDF, 使われている内容語]
            - [D, LSI 潜在意味, 内容語の共起による潜在意味]
          widths: [0.1, 0.35, 0.55]
          size: 16
      - bullets:
          - "類似度はコサイン係数のみ[^1]"
          - "判別は重心法（代表文書による分類）[^2]．作家別上位 k 平均との比較は補助 S5"
          - "scikit-learn 等を使わず，numpy と fugashi-plus[unidic-lite] のみでフルスクラッチ実装"
        size: 18
    footnotes:
      - 第 5 回 p.26，第 3 回 p.25
      - 第 2 回 p.48
    notes:
      time: 45 秒
      points:
        - 4 観点とも同じコサイン類似度と重心法で比べ，違いを特徴量だけに絞る．
        - scikit-learn 等を使わず，numpy と fugashi-plus[unidic-lite] のみで特徴抽出・類似度計算・推論をフルスクラッチ実装．
        - 図表は全特徴量で重心法にそろえる．
      runs: []
    num_sources: ["storyline:Slide 5"]

  # ------------------------------------------------------------------ 担当 A
  - id: "6"
    kind: main
    section: 担当 A
    title: 【担当 A】定義
    claim: どんな文字の並びを好み，どれくらい句読点を打つかという表層リズムで類似度を測る
    layout: single
    body:
      - bullets:
          - "文字 Bi-gram：隣り合う 2 文字の組（上位 1000）[^1]"
          - "記号ブロック：読点・文末記号・開き括弧類の 3 次元[^2]"
          - "値はすべて「出現回数 ÷ 総文字数」の相対頻度[^3]"
          - "平均文長は文末記号率 = 1 / 平均文長 として保持[^4]"
          - "二乗ノルム割合：‖x_{block}‖^{2} / ‖x‖^{2}（ブロックがベクトルの長さに占める割合）[^2]"
          - "Min-Max 正規化：各次元を [0, 1] に線形変換（アブレーションのみ）[^2]"
        size: 20
    footnotes:
      - 第 2 回 p.25
      - 独自設計
      - 第 5 回 p.12，第 5 回 p.10
      - 第 2 回 p.8
    notes:
      time: 45 秒
      points:
        - 「どんな文字の並びを好み，どれくらい句読点を打つか」という表層リズムで類似度を測る．
        - 文字 Bi-gram 上位 1000（第 2 回 p.25 の N-gram を文字に適用）と記号 3 次元（読点・文末記号・開き括弧類）．文書を文字の列とみなす（第 5 回 p.10）．
      runs: [記号特徴の設計は 010]
    num_sources: ["storyline:Slide 6"]

  - id: "7"
    kind: main
    section: 担当 A
    title: 【担当 A】実験の概要
    claim: 単一ブロックに支配されない正規化なしを既定とした
    layout: split
    ratio: 0.6
    left:
      - table:
          header: [構成, 二乗ノルム割合（全チャンクの平均）]
          rows:
            - ["既定仕様（Bi-gram ＋記号）", "Bi-gram / 記号 = 0.72 / 0.28（L = 100）\nBi-gram / 記号 = 0.57 / 0.43（L = 500）\nBi-gram / 記号 = 0.52 / 0.48（L = 1000）"]
            - ["旧案（＋字種構成比）", "字種が 0.98～0.99"]
            - ["旧案＋Min-Max", "Bi-gram が 0.88～0.96"]
          widths: [0.4, 0.6]
          size: 14
      - text: "正規化はブロックの重み付けを暗黙に決める操作[^1]"
    right:
      - text: "比較条件[^1]"
      - bullets:
          - "既定（Bi-gram ＋記号，正規化なし）"
          - "Min-Max 正規化"
          - "Bi-gram のみ"
          - "記号のみ"
        size: 18
    footnotes: [独自設計]
    notes:
      time: 45 秒
      points:
        - 正規化はブロックの重み付けを暗黙に決める操作のため，単一ブロックに支配されない正規化なしを既定とした．
        - 字種を入れると字種が約 99% を占め，Min-Max をかけると今度は Bi-gram が 88～96% を占める．相対頻度のみの既定仕様だけが単一ブロックに支配されない．
        - Min-Max は独自設計のアブレーションのみ．
      runs: [010 の実測（investigate_a_scale.py）]
    num_sources: ["storyline:Slide 7"]

  - id: "8"
    kind: main
    section: 担当 A
    title: 【担当 A】結果・考察
    claim: A は未知作品でも作家別 MAP の平均が全特徴量で最高だが，底本の表記の交絡が残る
    layout: split
    ratio: 0.6
    left:
      - figure: figures/a_ablation.png
        h: 3.9
      - text: "L = 500，重心法，間引きあり．点線は基準値[^1]"
        muted: true
    right:
      - bullets:
          - "作品間分割の作家別 MAP の平均 0.472[^2]"
          - "Min-Max は作品内分割で最高（0.973）．作品間分割では既定より低い"
          - "記号 3 次元だけでも作家別正解率の平均 0.455（基準値 0.25）"
          - "記号のみの MAP の低下は −0.007 とほぼない"
          - text: "考察（仮説，今回は分離していない）"
            sub:
              - "底本の表記方針や作品ごとの字種を拾っている可能性"
              - "漢字率：太宰 0.297 / 0.221，花袋 0.348 / 0.289"
              - "文字 Bi-gram が付属語を含む文字列（「た。」等）を拾っている可能性"
        size: 15
    footnotes:
      - 独自設計
      - 第 5 回 p.31 を参考にした独自設計
    notes:
      time: 75 秒
      points:
        - A は未知作品でも作家別 MAP の平均が全特徴量で最高（0.472）だが，底本の表記の交絡が残る．
        - 既定：Intra-work 0.584 ± 0.004 / 0.873 ± 0.018，Inter-work 0.472 ± 0.003 / 0.543 ± 0.011（作家別 MAP の平均 / 作家別正解率の平均）．
        - Min-Max 正規化：Intra-work 0.588 ± 0.003 / 0.973 ± 0.009，Inter-work 0.400 ± 0.005 / 0.514 ± 0.013．
        - Bi-gram のみ：Intra-work 0.581 ± 0.006 / 0.883 ± 0.021，Inter-work 0.422 ± 0.004 / 0.525 ± 0.020．
        - 記号のみ：Intra-work 0.379 ± 0.006 / 0.473 ± 0.031，Inter-work 0.371 ± 0.003 / 0.455 ± 0.010．句読点・文長は作品が変わっても残る手がかり．
        - 基準値：作家別 MAP の平均 0.258（Intra-work），0.260（Inter-work），作家別正解率の平均 0.25．
        - Bi-gram と記号の結合が Inter-work の MAP で最高．全作品の字種構成比は補助 S13．
      runs: [full_006（グラフ A は plot_slide_figures.py で full_006 の summary.csv から描画）]
    num_sources: ["storyline:Slide 8"]

  # ------------------------------------------------------------------ 担当 B
  - id: "9"
    kind: main
    section: 担当 B
    title: 【担当 B】定義
    claim: 何を書いたかではなく，品詞の並びと付属語の使い方（どう書いたか）で類似度を測る
    layout: single
    body:
      - bullets:
          - "付属語：助詞・助動詞[^1]"
          - "内容語：名詞・動詞・形容詞[^1]"
          - "品詞 2-gram：隣り合う品詞の組の出現 C(t_{i−1}, t_{i})．品詞は階層の上位 2 段[^2]"
          - "値はすべて相対頻度（出現回数 ÷ 総形態素数）[^3]"
          - "語のキー：表層形（既定）と語彙素[^4]"
          - text: "ブロック"
            sub:
              - "結合：品詞 2-gram ＋語（既定）"
              - "語のみ"
              - "品詞 2-gram のみ"
        size: 20
    footnotes:
      - 第 2 回 p.11
      - 第 2 回 p.30，第 2 回 p.36
      - 第 5 回 p.12
      - 第 2 回 p.16
    notes:
      time: 45 秒
